"$schema" = "https://railway.com/railway.schema.json"

# In Railway, set this service's Root Directory to the repo root (blank) and
# point "Config File Path" (in dashboard) to /server/railway.toml.
[build]
builder = "DOCKERFILE"
dockerfilePath = "server/Dockerfile"
watchPatterns = ["server/**", "shared/**", "package-lock.json"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
