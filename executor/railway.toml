"$schema" = "https://railway.com/railway.schema.json"

# Unlike server/client, the executor has no dependency on the shared workspace
# package, so set this service's Root Directory to "executor" (not blank) in
# the dashboard, and point "Config File Path" to /executor/railway.toml.
#
# Required service variables: GEMINI_API_KEY (Google AI Studio key).
# Optional: GEMINI_MODEL (defaults to gemini-2.5-flash).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
