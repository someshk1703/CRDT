"$schema" = "https://railway.com/railway.schema.json"

# In Railway, set this service's Root Directory to the repo root (blank) and
# point "Config File Path" (in dashboard) to /client/railway.toml.
[build]
builder = "DOCKERFILE"
dockerfilePath = "client/Dockerfile"
watchPatterns = ["client/**", "shared/**", "package-lock.json"]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
